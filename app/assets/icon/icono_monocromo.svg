<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Ícono temático de Android 13+: solo cuenta la silueta (canal alfa).
       El grano queda como hueco dentro del pin. -->
